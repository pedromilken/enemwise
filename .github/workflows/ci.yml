name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install --only-binary "numpy,pandas,scipy,pyarrow" -e ".[dev,parquet]"
      # qualquer leitura ou gravação sem encoding explícito vira erro, em qualquer sistema
      - run: python -X warn_default_encoding -m pytest -q -W "error::EncodingWarning"
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
